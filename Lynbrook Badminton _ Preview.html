<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lynbrook Badminton | LHS Vikings</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--navy:#001A4D;--red:#C8102E;--gold:#FFB81C;--bg:#F4F6F9;--card:#fff;--text:#1E293B;--muted:#64748B;--line:#E2E8F0;box-sizing:border-box}

.wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}.section{padding-top:2rem;padding-bottom:2rem}

footer{background:var(--navy);color:#fff;text-align:center;padding:1.75rem 1rem;margin-top:3rem}footer a{color:var(--gold)}
@media(max-width:900px){.menu-btn{display:block}

.badge.st-present{background:#DCFCE7;color:#166534}.badge.st-excused{background:#FEF3C7;color:#92400E}.badge.st-unexcused{background:#FEE2E2;color:#991B1B}

.mini{padding:.1rem .7rem;margin:0 0 0 .5rem}table select{padding:.35rem .5rem}.stack>.card,.stack>#panel>.card{margin-bottom:1.25rem}
tr.lyn td{background:var(--navy);color:#fff;font-weight:600}tr.lyn td:first-child{box-shadow:inset 6px 0 0 var(--red)}
.vik{background:var(--red);color:#fff;padding:.1rem .65rem;border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin:1rem 0;font-size:.95rem}.swatch{display:inline-block;width:1.2rem;height:1.2rem;border-radius:4px;border:2px solid var(--line);vertical-align:middle;margin-right:.5rem;background:var(--card)}

.seg{display:flex;gap:.3rem;flex-wrap:wrap}.seg button{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:.25rem .65rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}

.matrix td.me{background:var(--gold);color:var(--navy);font-weight:700}.matrix select{width:100%;margin-bottom:.25rem;padding:.3rem;font-size:.85rem}.matrix select:last-child{margin-bottom:0}
.me-card{border-left:6px solid var(--red);margin-top:1rem}.me-card p{margin:.4rem 0}
table.log{min-width:760px}.log input[type=date]{width:auto;padding:.3rem .4rem;font-size:.85rem}.log select{width:auto}
.tag.t-varsity{background:var(--red)}.tag.t-open{background:var(--gold);color:var(--navy)}
textarea{font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%;resize:vertical}textarea:focus{border-color:var(--navy);outline:none}
.row{display:flex;gap:.4rem;align-items:center}.row input{flex:1}.row .mini{margin:0}.row button[disabled]{opacity:.35;cursor:default}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.75rem 0 .5rem}.cal-bar h3{margin:0;font-size:1.4rem}.cal-bar .mini{margin:0 0 0 .4rem;padding:.35rem .8rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:730px}.cal-dow{background:var(--navy);color:#fff;font-weight:700;text-align:center;padding:.5rem 0}
.cal-day{min-height:96px;border:1px solid var(--line);padding:.3rem;display:flex;flex-direction:column;gap:.25rem}.cal-day.off{background:var(--bg);opacity:.6}.cal-day.today{box-shadow:inset 0 0 0 3px var(--gold)}
.cal-num{font-weight:700;font-size:.85rem;color:var(--muted)}.cal-day.today .cal-num{color:var(--red)}
.chip{display:block;font-size:.72rem;font-weight:700;line-height:1.25;padding:.15rem .4rem;border-radius:6px;color:#fff;overflow-wrap:anywhere}
.chip.t-varsity{background:var(--red)}.chip.t-jv{background:#3B5BA9}.chip.t-open{background:var(--gold);color:var(--navy)}.chip.match{background:var(--navy);box-shadow:inset 4px 0 0 var(--red);padding-left:.6rem}.chip.chg{outline:2px solid var(--gold);outline-offset:1px}.chip.x{text-decoration:line-through;opacity:.6}
#panel .card{margin-bottom:1.25rem}.tabs{flex-wrap:wrap}.subtabs{margin:0 0 1rem}
#view{flex:1;display:flex;flex-direction:column}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}

<body><div id="site-header"></div><div id="view"></div><div id="site-footer"></div>
<script>(() => {
'use strict';
let cur = 'home';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('lhsb:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lhsb:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('lhsb:' + k); } catch {} }
};
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dayOf = s => new Date(s + 'T00:00').getDay();
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], DOW_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fmt = s => new Date(s + 'T00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const shortD = s => +s.slice(5, 7) + '/' + +s.slice(8);
const fmtT = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
const TYPES = ['varsity', 'jv', 'open'];
const TYPE = { varsity: 'Varsity Practice', jv: 'JV Practice', open: 'Saturday Open Gym', practice: 'Practice (older entries)' };
const STATUS = { present: 'Present', excused: 'Excused Absent', unexcused: 'Unexcused Absent' };
const SHORT = { present: 'Present', excused: 'Excused', unexcused: 'Unexcused' };
const st = r => r.status || 'present';
const badge = r => `<span class="badge st-${st(r)}">${STATUS[st(r)]}</span>`;
const sameId = (a, b) => String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
const splitName = s => { const [f, ...r] = String(s || '').trim().split(/\s+/); return [f || '', r.join(' ')]; };
const fullName = p => `${p.first || ''} ${p.last || ''}`.trim();

/* ---------- data (edit these) ---------- */
const ADMIN_CODE = 'viking2026'; // CHANGE THIS
const DONATE_URL = '';           // paste your team donation link (Venmo, PayPal, booster club page...) to show a Donate button
const PAGES = [['#home','Home'],['#schedule','Schedule'],['#attendance','Check-In'],['#portal','Portal'],['#admin','Admin']];
// Default weekly schedule. Day numbers: 0 = Sun ... 6 = Sat; 24-hour times. Only Saturday Open Gym is scheduled by default.
// Varsity and JV practices appear only when a coach adds them in the Admin page (their times below just pre-fill the form).
const DEFAULT_TIMES = { varsity: ['16:00', '18:00'], jv: ['18:00', '20:00'], open: ['17:00', '20:00'] };
const DEFAULT_DAYS = { varsity: [], jv: [], open: [6] };
// Master roster starting list. Leave empty and add players in the Admin page, or paste them here:
// { id:'123456', first:'First', last:'Last', gender:'Male', division:'Varsity', grade:'11' }
const ROSTER_SEED = [];
// Line-up sheet: event code -> [label, players per slot, gender for each player]. POS = ranks per event (1-3 only).
const LINE = { BS:['Boys Singles',1,['Male']], GS:['Girls Singles',1,['Female']], BD:['Boys Doubles',2,['Male','Male']], GD:['Girls Doubles',2,['Female','Female']], MXD:['Mixed Doubles',2,['Male','Female']] };
const POS = 3, BLOCKS = { V:'Varsity', J:'JV' };
const code = (b, n) => (b === 'V' ? 'V' : 'JV') + n;
// Official SCVAL De Anza Division badminton schedule, 2026-27 (posted 7/21/26). Format: AWAY@HOME
const TEAMS = { C:'Cupertino', G:'Gunn', H:'Homestead', L:'Lynbrook', M:'Milpitas', V:'Monta Vista', P:'Palo Alto', W:'Wilcox' };
const DAYS = {
  '2027-03-02':'V@G P@W',          '2027-03-04':'C@W P@V M@G L@H', '2027-03-09':'V@C W@M H@P G@L',
  '2027-03-11':'C@M V@H L@W P@G',  '2027-03-16':'H@C M@L G@V W@P', '2027-03-18':'C@L H@G P@M V@W',
  '2027-03-23':'G@C L@P W@H M@V',  '2027-03-25':'C@P G@W V@L H@M', '2027-03-30':'W@C V@P G@M H@L',
  '2027-04-01':'C@V M@W P@H L@G',  '2027-04-06':'C@H L@M',         '2027-04-08':'M@C H@V W@L',
  '2027-04-15':'G@P',              '2027-04-20':'L@C G@H M@P W@V', '2027-04-22':'C@G P@L H@W V@M',
  '2027-04-27':'P@C W@G L@V M@H'
};
const EVENTS = [
  { date:'2027-04-29', time:'1:00 PM', text:'League play @ Fremont' },
  { date:'2027-04-30', time:'1:00 PM', text:'League play @ Fremont' },
  { date:'2027-05-01', time:'9:00 AM', text:'League Finals @ Fremont' }
];
const DEFAULT_MATCHES = [
  ...Object.entries(DAYS).flatMap(([date, s]) => s.split(' ').map(x => { const [a, h] = x.split('@'); return { date, time: '5:15 or 6:00 PM', away: TEAMS[a], home: TEAMS[h] }; })),
  ...EVENTS
].sort((a, b) => a.date.localeCompare(b.date)).map((m, i) => ({ id: 'm' + i, ...m }));
const isLyn = m => m.away === 'Lynbrook' || m.home === 'Lynbrook';
const opp = m => m.home === 'Lynbrook' ? m.away : m.home;
const matchLabel = m => `${opp(m)} – ${shortD(m.date)} (${m.home === 'Lynbrook' ? 'Home' : 'Away'})`;
const CLEAR = [
  { id:'online', label:'Complete Athletic Clearance online' },
  { id:'physical', label:'Upload doctor’s physical form' },
  { id:'gear', label:'Racket, non-marking shoes & water bottle' }
];
const ANN = [
  { id:'a1', t:'Athletic clearance comes first', b:'You can’t join team practice until your online clearance and physical form are approved.' },
  { id:'a2', t:'Open Gym shoe rule', b:'Non-marking indoor shoes are required for entry.' },
  { id:'a4', t:'No team fees', b:'There are no required dues. Optional donations help cover shuttlecocks and equipment.' }
];
// Sample data for testing (Admin > Load sample players, or Portal > Try demo account)
const SAMPLE = [
  ['100001','Aarav','Patel','Male','Varsity','12'],['100002','Maya','Chen','Female','Varsity','11'],['100003','Ethan','Wu','Male','Varsity','12'],['100004','Rohan','Iyer','Male','Varsity','11'],
  ['100005','Kevin','Tran','Male','Varsity','10'],['100006','Lily','Zhang','Female','Varsity','12'],['100007','Sophia','Nguyen','Female','Varsity','10'],['100008','Emma','Kim','Female','Varsity','11'],
  ['100009','Daniel','Park','Male','JV','10'],['100010','Jason','Lin','Male','JV','9'],['100011','Priya','Shah','Female','JV','10'],['100012','Chloe','Wang','Female','JV','9'],
  ['100013','Nikhil','Rao','Male','JV','9'],['100014','Andrew','Ho','Male','JV','10'],['100015','Grace','Liu','Female','JV','9'],['100016','Isabella','Cho','Female','JV','10']
].map(([id, first, last, gender, division, grade]) => ({ id, first, last, gender, division, grade }));
const DEMO_LU = { V: { BS1:['100004'], GS1:['100002'], BD1:['100001','100003'], BS2:['100005'], GD2:['100006','100007'], GS3:['100008'] },
                  J: { BS1:['100010'], GS1:['100011'], BD1:['100009','100010'], BS2:['100013'], GD2:['100012','100015'], MXD3:['100014','100016'] } };

/* ---------- state helpers ---------- */
const normP = p => { const q = p.first !== undefined ? p : (([first, last]) => ({ ...p, first, last }))(splitName(p.name)); return { gender: '', ...q }; }; // upgrades older saved players
const roster = () => store.get('roster', ROSTER_SEED).map(normP);
const player = id => roster().find(p => sameId(p.id, id));
const users = () => store.get('users', {});
const me = () => users()[store.get('session', null)] || null;
const nameOf = u => { const p = player(u.id); return p ? fullName(p) : (u.name || String(u.id)); };
const firstOf = u => player(u.id)?.first || splitName(u.name || u.id)[0];
const newRid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const records = () => { const r = store.get('attendance', []); let ch = false; r.forEach((x, i) => { if (!x.rid) { x.rid = 'r' + x.ts + '_' + i; ch = true; } }); if (ch) store.set('attendance', r); return r; };
const rName = r => r.first !== undefined ? [r.first, r.last || ''] : splitName(r.who); // older records only have "who"

/* ---------- practice schedule: defaults + per-date overrides ---------- */
const defTimes = (t, date) => DEFAULT_DAYS[t].includes(dayOf(date)) ? DEFAULT_TIMES[t] : null;
function sessionsOn(date) {
  const ov = overrides().filter(o => o.date === date);
  return TYPES.flatMap(t => { const def = defTimes(t, date), o = ov.find(x => x.type === t);
    if (!def && !o) return [];
    const start = o ? o.start : def[0], end = o ? o.end : def[1];
    return [{ type: t, date, start, end, note: o?.note || '', cancelled: !!o?.cancelled, changed: !!o && !!def && (!!o.cancelled || start !== def[0] || end !== def[1]) }]; })
    .sort((a, b) => a.start.localeCompare(b.start));
}
const daysLabel = a => a.length === 1 ? DOW_FULL[a[0]] + 's' : a.length > 2 && a[a.length - 1] - a[0] === a.length - 1 ? DOW[a[0]] + '–' + DOW[a[a.length - 1]] : a.map(d => DOW[d]).join(', ');
const sessionLine = (date, t) => { if (!date) return ''; const s = sessionsOn(date).find(x => x.type === t);
  return !s ? `No ${TYPE[t]} is scheduled on this date.` : s.cancelled ? `${TYPE[t]} is cancelled on this date.` : `${TYPE[t]} · ${fmtT(s.start)} – ${fmtT(s.end)}${s.changed ? ' (time changed)' : ''}`; };

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
// show "First Last" under an ID box as the player types
function idLookup(input, note, firstEl, lastEl, extra) {
  const run = () => { const v = input.value.trim(), p = v && player(v);
    if (firstEl) firstEl.value = p ? p.first : ''; if (lastEl) lastEl.value = p ? p.last : ''; if (extra) extra(p);
    note.textContent = !v ? '' : p ? `✓ ${fullName(p)}` : roster().length ? 'No player with that ID. Check the number or ask your coach.' : 'The team roster is empty. Ask your coach to add players.'; return p; };
  input.oninput = run; return run;
}

/* ---------- line-up helpers ---------- */
function setSlot(date, b, k, j, val) {
  const all = lineups(); all[date] = all[date] || {}; all[date][b] = all[date][b] || {};
  const arr = [...(all[date][b][k] || [])]; arr[j] = val; for (let i = 0; i < arr.length; i++) arr[i] = arr[i] || '';
  if (arr[0] && arr[1] && sameId(arr[0], arr[1])) return false;
  if (arr.every(x => !x)) delete all[date][b][k]; else all[date][b][k] = arr;
  store.set('lineups', all); return true;
}
function matrix(date, b, o = {}) {
  const lu = (lineups()[date] || {})[b] || {}, cats = Object.keys(LINE), ro = roster().sort(byName), dv = BLOCKS[b];
  // dropdown: players who fit the slot (division + gender) first, then everyone else
  const opts = (sel, g) => { const mk = p => `<option value="${esc(p.id)}"${sameId(p.id, sel) ? ' selected' : ''}>${esc(fullName(p))}</option>`, fit = p => p.division === dv && p.gender === g;
    const a = ro.filter(fit), z = ro.filter(p => !fit(p));
    return '<option value="">—</option>' + (a.length ? `<optgroup label="${dv} ${g === 'Male' ? 'boys' : 'girls'}">${a.map(mk).join('')}</optgroup>` : '') + (z.length ? `<optgroup label="${a.length ? 'Other players' : 'All players'}">${z.map(mk).join('')}</optgroup>` : ''); };
  let h = `<div class="table-wrap"><table class="matrix"><thead><tr><th>${dv}</th>${cats.map(c => `<th title="${LINE[c][0]}">${c}</th>`).join('')}</tr></thead><tbody>`;
  for (let n = 1; n <= POS; n++) h += `<tr><th scope="row">${code(b, n)}</th>` + cats.map(c => { const k = c + n, ids = (lu[k] || []).filter(Boolean), raw = lu[k] || [];
    const body = o.edit ? Array.from({ length: LINE[c][1] }, (_, j) => `<select data-k="${k}" data-j="${j}" aria-label="${dv} ${k} player ${j + 1}">${opts(raw[j], LINE[c][2][j])}</select>`).join('')
      : ids.length ? esc(ids.map(i => { const p = player(i); return p ? fullName(p) : i; }).join(' / ')) : '<span class="muted">—</span>';
    return `<td class="${o.me && ids.some(i => sameId(i, o.me)) ? 'me' : ''}">${body}</td>`; }).join('') + '</tr>';
  return h + '</tbody></table></div>';
}
function mySlots(date, id) {
  return Object.keys(BLOCKS).flatMap(b => Object.entries((lineups()[date] || {})[b] || {}).filter(([, ids]) => ids.some(i => sameId(i, id)))
    .map(([k, ids]) => { const [, cat, n] = k.match(/^([A-Z]+)(\d+)$/); return { b, k, cat, n: +n, partner: ids.filter(i => i && !sameId(i, id)).map(i => { const p = player(i); return p ? fullName(p) : i; }) }; }))
    .filter(s => LINE[s.cat] && s.n <= POS).sort((x, y) => x.b.localeCompare(y.b) * -1 || x.n - y.n);
}

/* ---------- schedule ---------- */
function schedule() {
  $('#defaults').innerHTML = TYPES.filter(t => DEFAULT_DAYS[t].length).map(t => `<article class="card session ${t}"><span class="tag t-${t}">${TYPE[t]}</span><h3>${daysLabel(DEFAULT_DAYS[t])}</h3><p>${fmtT(DEFAULT_TIMES[t][0])} – ${fmtT(DEFAULT_TIMES[t][1])}</p></article>`).join('');
  let f = 'all', view = today().slice(0, 7);
  const hm = t => { const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : ''); }, ap = t => +t.slice(0, 2) < 12 ? 'AM' : 'PM';
  const rng = (s, e) => `${hm(s)}${ap(s) === ap(e) ? '' : ' ' + ap(s)}–${hm(e)} ${ap(e)}`, SH = { varsity: 'Varsity', jv: 'JV', open: 'Open Gym' };
  const drawCal = () => { const [y, m] = view.split('-').map(Number), lead = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate(), total = Math.ceil((lead + n) / 7) * 7, notes = []; let cells = '';
    for (let i = 0; i < total; i++) { const day = i - lead + 1;
      if (day < 1 || day > n) { cells += '<div class="cal-day off"></div>'; continue; }
      const date = `${view}-${String(day).padStart(2, '0')}`;
      const chips = (f === 'match' ? [] : sessionsOn(date).filter(s => f === 'all' || s.type === f)).map(s => { if (s.note) notes.push(`${fmt(date)} · ${SH[s.type]}: ${s.note}`);
          return `<span class="chip t-${s.type}${s.cancelled ? ' x' : ''}${s.changed && !s.cancelled ? ' chg' : ''}" title="${esc(TYPE[s.type] + (s.cancelled ? ' (cancelled)' : '') + (s.note ? ' – ' + s.note : ''))}">${SH[s.type]} ${s.cancelled ? 'cancelled' : rng(s.start, s.end)}</span>`; })
        .concat(f === 'all' || f === 'match' ? matches().filter(x => x.date === date && isLyn(x)).map(x => `<span class="chip match" title="Lynbrook match · ${x.time}">${x.home === 'Lynbrook' ? 'vs' : '@'} ${esc(opp(x))}</span>`) : []);
      cells += `<div class="cal-day${date === today() ? ' today' : ''}"><span class="cal-num">${day}</span>${chips.join('')}</div>`; }
    $('#cal-title').textContent = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    $('#cal-grid').innerHTML = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('') + cells;
    $('#cal-notes').innerHTML = notes.map(x => `<li class="muted">${esc(x)}</li>`).join(''); };
  const shift = k => { const [y, m] = view.split('-').map(Number), d = new Date(y, m - 1 + k, 1); view = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; drawCal(); };
  $('#cal-prev').onclick = () => shift(-1); $('#cal-next').onclick = () => shift(1); $('#cal-today').onclick = () => { view = today().slice(0, 7); drawCal(); };
  $$('[data-filter]').forEach(b => b.onclick = () => { f = b.dataset.filter; $$('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawCal(); });
  drawCal();
  const q = $('#q'), lf = $('#lf'), body = $('#matches'), team = t => t === 'Lynbrook' ? '<span class="vik">Lynbrook</span>' : esc(t);
  const drawM = () => { const s = q.value.trim().toLowerCase(), l = lf.value;
    const rows = matches().filter(m => (l === 'all' || (l === 'lyn' && isLyn(m)) || (l === 'home' && m.home === 'Lynbrook') || (l === 'away' && m.away === 'Lynbrook'))
      && (!s || `${m.away || ''} ${m.home || ''} ${m.text || ''} ${fmt(m.date)}`.toLowerCase().includes(s)));
    body.innerHTML = rows.length ? rows.map(m => `<tr class="${isLyn(m) ? 'lyn' : ''}${m.date < today() ? ' past' : ''}"><td>${fmt(m.date)}</td><td>${m.time}</td>${m.text ? `<td colspan="2"><strong>${m.text}</strong></td>` : `<td>${team(m.away)}</td><td>${team(m.home)}</td>`}</tr>`).join('')
      : '<tr><td colspan="4">No matches found.</td></tr>'; };
  q.oninput = lf.onchange = drawM; drawM();
}

/* ---------- attendance (ID-based check-in, tagged with the session attended) ---------- */
function attendance() {
  const date = $('#date'), who = $('#who'), type = $('#type'), fb = $('#feedback'); date.value = date.max = today(); let manual = false;
  const suggest = p => dayOf(date.value) === 6 ? 'open' : p && p.division === 'JV' ? 'jv' : 'varsity';
  const hint = () => { $('#sess-note').textContent = sessionLine(date.value, type.value); };
  const lookup = idLookup(who, $('#idnote'), $('#pfirst'), $('#plast'), p => { $('#pgender').value = p?.gender || ''; $('#pdiv').value = p ? p.division : ''; if (!manual) type.value = suggest(p); hint(); });
  type.onchange = () => { manual = true; hint(); };
  date.onchange = () => { if (!manual) type.value = suggest(player(who.value.trim())); hint(); };
  const u = me(); if (u) who.value = u.id; lookup();
  $('#checkin').onsubmit = e => { e.preventDefault();
    const p = lookup(), t = type.value, d = date.value, r = records();
    const msg = (m, c) => { fb.className = 'msg ' + c; fb.textContent = m; };
    if (!who.value.trim() || !d) return msg('Enter your Student ID and pick a date.', 'err');
    if (!p) return msg('That Student ID isn’t on the team roster. Check the number or ask your coach.', 'err');
    const dup = r.find(x => x.date === d && x.type === t && recOf(x, p));
    if (dup) return msg(`${fullName(p)} is already on the ${TYPE[t]} list for ${fmt(d)} as ${STATUS[st(dup)]}. See your coach to change it.`, 'err');
    r.push({ rid: newRid(), id: p.id, first: p.first, last: p.last, who: fullName(p), div: p.division, date: d, type: t, status: 'present', ts: Date.now() }); store.set('attendance', r);
    msg(`✅ Checked in! ${fullName(p)} (${p.division}) · ${TYPE[t]} · ${fmt(d)}`, 'ok'); manual = false; if (!u) { who.value = ''; lookup(); }
  };
}

      pcSel.innerHTML = ps.map(p => `<option value="${esc(p.id)}"${sameId(p.id, pcId) ? ' selected' : ''}>${esc(p.last)}, ${esc(p.first)} (${esc(p.id)})</option>`).join('') || '<option value="">No players on roster</option>';
      const p = player(pcId), c = p ? clearOf(p.id) : {};
      $('#pc-list').innerHTML = !p ? '<p class="muted">Add players to the roster first.</p>' : items.length ? items.map(i => `<label class="check"><input type="checkbox" data-c="${esc(i.id)}"${c[i.id] ? ' checked' : ''}><span>${esc(i.label)}</span></label>`).join('') : '<p class="muted">No checklist items yet. Add some above.</p>';
      $('#pc-body').innerHTML = ps.length ? ps.map(q => { const k = clearOf(q.id), a = items.filter(i => k[i.id]).length; return `<tr><td>${esc(q.first)}</td><td>${esc(q.last)}</td><td>${esc(q.division)}</td><td>${items.length ? `${a} of ${items.length}${a === items.length ? ' ✅' : ''}` : '—'}</td><td><button class="btn btn-line mini" data-pc="${esc(q.id)}">Edit</button></td></tr>`; }).join('') : '<tr><td colspan="5">No players yet.</td></tr>'; };
    pcSel.onchange = () => { pcId = pcSel.value; drawPC(); };
    $('#pc-list').onchange = e => { const id = e.target.dataset.c; if (!id || pcId === null) return; const c = clearOf(pcId); c[id] = e.target.checked; store.set('clear:' + pcId, c); drawPC(); };
    const setAll = v => { if (pcId === null) return; const c = {}; checklist().forEach(i => { c[i.id] = v; }); store.set('clear:' + pcId, c); drawPC(); toast(v ? 'Marked all done' : 'Cleared all'); };
    $('#pc-all').onclick = () => setAll(true); $('#pc-none').onclick = () => setAll(false);
    $('#pc-body').onclick = e => { const b = e.target.closest('button[data-pc]'); if (!b) return; pcId = b.dataset.pc; drawPC(); pcSel.scrollIntoView?.({ block: 'center' }); };
/* league matches: edit, add, delete, reset to the official SCVAL list */
    const mmF = $('#mm-filter'), teamNames = Object.values(TEAMS);
    const teamOpts = cur => (teamNames.includes(cur) ? teamNames : [...teamNames, cur]).map(t => `<option${t === cur ? ' selected' : ''}>${esc(t)}</option>`).join('');
    $('#mm-away').innerHTML = teamOpts('Cupertino'); $('#mm-home').innerHTML = teamOpts('Lynbrook');
    const drawMM = () => { const l = matches().filter(m => mmF.value === 'all' || m.text !== undefined || isLyn(m));
      $('#mm-body').innerHTML = l.length ? l.map(m => `<tr data-id="${esc(m.id)}"><td><input type="date" data-f="date" value="${esc(m.date)}" aria-label="Date"></td><td><input data-f="time" value="${esc(m.time)}" aria-label="Time"></td>${m.text !== undefined
        ? `<td colspan="2"><input data-f="text" value="${esc(m.text)}" aria-label="Event"></td>`
        : `<td><select data-f="away" aria-label="Away team">${teamOpts(m.away)}</select></td><td><select data-f="home" aria-label="Home team">${teamOpts(m.home)}</select></td>`}<td><button class="btn btn-line mini" data-del="${esc(m.id)}">Delete</button></td></tr>`).join('') : '<tr><td colspan="5">No matches.</td></tr>'; };
    const saveMM = all => { store.set('matches', all); drawMM(); fillLM(); drawLU(); };
    mmF.onchange = drawMM;
    $('#mm-body').onchange = e => { const t = e.target, f = t.dataset.f; if (!f) return; const id = t.closest('tr').dataset.id, all = matches(), m = all.find(x => x.id === id); if (!m) return; const v = t.value.trim();
      if (f === 'date' && !v) { drawMM(); return toast('Pick a date'); }
      if (f === 'text' && !v) { drawMM(); return toast('The event needs a description'); }
      if ((f === 'away' || f === 'home') && v === (f === 'away' ? m.home : m.away)) { drawMM(); return toast('A team can’t play itself'); }
      if (f === 'date' && m.date !== v && isLyn(m)) { const lu = lineups(); // keep the line-up with the match when its date moves
        if (lu[m.date] && !lu[v] && !all.some(x => x.id !== id && x.date === m.date && isLyn(x))) { lu[v] = lu[m.date]; delete lu[m.date]; store.set('lineups', lu); } }
      m[f] = v; saveMM(all); toast('Match updated'); };
    $('#mm-body').onclick = e => { const b = e.target.closest('button[data-del]'); if (!b) return; saveMM(matches().filter(m => m.id !== b.dataset.del)); toast('Deleted'); };
    $('#mm-form').onsubmit = e => { e.preventDefault(); const d = $('#mm-date').value, a = $('#mm-away').value, h = $('#mm-home').value;
      if (!d) return toast('Pick a date'); if (a === h) return toast('A team can’t play itself');
      const all = matches(); all.push({ id: 'm' + Date.now(), date: d, time: $('#mm-time').value.trim(), away: a, home: h }); saveMM(all); toast('Match added'); };
    $('#me-form').onsubmit = e => { e.preventDefault(); const d = $('#me-date').value, t = $('#me-text').value.trim(); if (!d || !t) return toast('Add a date and a description');
      const all = matches(); all.push({ id: 'm' + Date.now(), date: d, time: $('#me-time').value.trim(), text: t }); $('#me-text').value = ''; saveMM(all); toast('Event added'); };
    let mmRst = 0; $('#mm-reset').onclick = e => { const b = e.target, label = 'Reset to official SCVAL schedule';
      if (!mmRst) { b.textContent = 'Click again to restore the official schedule'; mmRst = setTimeout(() => { mmRst = 0; b.textContent = label; }, 4000); return; }
      clearTimeout(mmRst); mmRst = 0; b.textContent = label; store.del('matches'); drawMM(); fillLM(); drawLU(); toast('Restored the official SCVAL schedule'); };
    function refresh() { drawP(); drawLP(); drawA(); drawLU(); drawPC(); }
    drawO(); loadO(); drawPick(); drawAn(); drawCk(); drawMM(); refresh();
  }
  show();
}

const VIEWS = {"home": "<section class=\"hero\"><h1>Lynbrook High School Badminton<\/h1><p>Home of the Vikings Badminton Team &amp; Community Open Gym.<\/p><a class=\"btn btn-gold btn-xl\" href=\"#attendance\">Check In Now<\/a><a class=\"btn btn-ghost btn-xl\" href=\"#schedule\">View Schedule<\/a><\/section>\n<main class=\"wrap section\"><div class=\"grid\" id=\"next\" style=\"margin-bottom:1.5rem\"><\/div>\n<div class=\"card\"><h2>\ud83d\udce3 Quick Announcements<\/h2><div id=\"ann\"><\/div><\/div><\/main>", "schedule": "<section class=\"page-head\"><div class=\"wrap\"><h1>Schedule<\/h1><p>Open gym, practices and league matches.<\/p><\/div><\/section>\n<main class=\"wrap section\"><h2>Open Gym &amp; Practices<\/h2>\n<div class=\"grid\" id=\"defaults\"><\/div>\n<p class=\"muted\" style=\"margin-top:.75rem\">Varsity and JV practices show up on the calendar when coaches schedule them. Coaches can also change the time of any day. Non-marking indoor shoes are required for Open Gym.<\/p>\n<div class=\"cal-bar\"><h3 id=\"cal-title\"><\/h3><div><button class=\"btn btn-line mini\" id=\"cal-prev\" aria-label=\"Previous month\">\u2039 Prev<\/button><button class=\"btn btn-line mini\" id=\"cal-today\">Today<\/button><button class=\"btn btn-line mini\" id=\"cal-next\" aria-label=\"Next month\">Next \u203a<\/button><\/div><\/div>\n<div class=\"pills\" role=\"group\" aria-label=\"Filter calendar\"><button class=\"pill\" data-filter=\"all\" aria-pressed=\"true\">All<\/button><button class=\"pill\" data-filter=\"varsity\" aria-pressed=\"false\">Varsity Practice<\/button><button class=\"pill\" data-filter=\"jv\" aria-pressed=\"false\">JV Practice<\/button><button class=\"pill\" data-filter=\"open\" aria-pressed=\"false\">Open Gym<\/button><button class=\"pill\" data-filter=\"match\" aria-pressed=\"false\">Lynbrook Matches<\/button><\/div>\n<div class=\"table-wrap\"><div class=\"cal\" id=\"cal-grid\"><\/div><\/div>\n<ul class=\"clean\" id=\"cal-notes\" style=\"margin-top:.5rem\"><\/u age-head\"><div class=\"wrap\"><h1>Attendance Check-In<\/h1><p>Enter your Student ID. Your details fill in automatically.<\/p><\/div><\/section>\n<main class=\"wrap section\"><div class=\"card\" style=\"max-width:560px;margin:0 auto\"><h2>Check In<\/h2>\n<form id=\"checkin\" novalidate><label for=\"who\">Student ID Number<\/label><input id=\"who\" inputmode=\"numeric\" autocomplete=\"off\" required>\n<p id=\"idnote\" class=\"muted\" style=\"margin-top:.3rem\" aria-live=\"polite\"><\/p>\n<label for=\"pfirst\">First Name<\/label><input id=\"pfirst\" readonly tabindex=\"-1\" placeholder=\"Fills in from your ID\"><label for=\"plast\">Last Name<\/label><input id=\"plast\" readonly tabindex=\"-1\" placeholder=\"Fills in from your ID\">\n<label for=\"pgender\">Gender<\/label><input id=\"pgender\" readonly tabindex=\"-1\" placeholder=\"Fills in from your ID\"><label for=\"pdiv\">Division<\/label><input id=\"pdiv\" readonly tabindex=\"-1\" placeholder=\"Fills in from your ID\">\n<label for=\"date\">Date<\/label><input id=\"date\" type=\"date\" required><label for=\"type\">Session you attended<\/label><select id=\"type\"><option value=\"varsity\">Varsity Practice<\/option><option value=\"jv\">JV Practice<\/option><option value=\"open\">Saturday Open Gym<\/option><\/select>\n<p class=\"muted\" id=\"sess-note\" style=\"margin-top:.3rem\" aria-live=\"polite\"><\/p>\n<button class=\"btn btn-red\" style=\"margin-top:1.25rem\">Check In<\/button><\/form><div id=\"feedback\" role=\"status\" aria-live=\"polite\"><\/div><\/div><\/main>", "portal": "<section class=\"page-head\"><div class=\"wrap\"><h1>Player Portal<\/h1><p>Sign in with your Student ID to see your stats and next game position. Demo only: accounts live in this browser, not on a server.<\/p><\/div><\/section>\n<main class=\"wrap section\"><div class=\"auth card\" id=\"auth\"><div class=\"tabs\"><button class=\"pill\" data-tab=\"login\" aria-pressed=\"true\">Log in<\/button><button class=\"pill\" data-tab=\"reg\" aria-press ria-label=\"Status\"><option value=\"present\">Present<\/option><option value=\"excused\">Excused Absent<\/option><option value=\"unexcused\">Unexcused Absent<\/option><\/select><button class=\"btn btn-red\" style=\"margin:0\">Add log<\/button><\/form>\n<div class=\"tools\"><input id=\"h-q\" type=\"search\" placeholder=\"Filter: player name or ID\" aria-label=\"Filter by player\"><input id=\"h-date\" type=\"date\" aria-label=\"Filter by date\"><select id=\"h-type\" aria-label=\"Filter by session\"><option value=\"all\">All sessions<\/option><option value=\"varsity\">Varsity Practice<\/option><option value=\"jv\">JV Practice<\/option><option value=\"open\">Saturday Open Gym<\/option><\/select><select id=\"h-st\" aria-label=\"Filter by status\"><option value=\"all\">All statuses<\/option><option value=\"present\">Present<\/option><option value=\"excused\">Excused Absent<\/option><option value=\"unexcused\">Unexcused Absent<\/option><\/select><button type=\"button\" class=\"btn btn-line\" id=\"h-clear\" style=\"margin:0\">Clear<\/button><button class=\"btn btn-gold\" id=\"csv\" style=\"margin:0\">Download CSV<\/button><\/div>\n<p class=\"muted\" id=\"h-count\"><\/p><div class=\"table-wrap\"><table class=\"log\"><thead><tr><th>ID<\/th><th>First Name<\/th><th>Last Name<\/th><th>Date<\/th><th>Session<\/th><th>Status<\/th><th><\/th><\/tr><\/thead><tbody id=\"h-body\"><\/tbody><\/table><\/div><\/div>\n<\/section>\n\n<section data-pane=\"schedule\" hidden>\n<div class=\"tabs subtabs\" data-group=\"sched\"><button class=\"pill\" data-s=\"sessions\" aria-pressed=\"true\">Practices &amp; open gym<\/button><button class=\"pill\" data-s=\"matches\" aria-pressed=\"false\">League matches<\/button><\/div>\n<div class=\"card\" data-sg=\"sched\" data-s=\"sessions\"><h2>Practices &amp; open gym<\/h2><p class=\"muted\" id=\"def-times\"><\/p>\n<form id=\"o-form\" class=\"grid\" novalidate>\n<div><label for=\"o-date\">Date<\/label><input id=\"o-date\" type=\"date\"><\/div><div><label for= orm id=\"me-form\" class=\"tools\" novalidate><input id=\"me-date\" type=\"date\" aria-label=\"Event date\"><input id=\"me-time\" placeholder=\"Time\" aria-label=\"Event time\"><input id=\"me-text\" placeholder=\"e.g. League Finals @ Fremont\" aria-label=\"Event\"><button class=\"btn btn-line\" style=\"margin:0\">Add event<\/button><\/form>\n<div class=\"table-wrap\"><table class=\"log\"><thead><tr><th>Date<\/th><th>Time<\/th><th>Away<\/th><th>Home<\/th><th><\/th><\/tr><\/thead><tbody id=\"mm-body\"><\/tbody><\/table><\/div><\/div>\n<\/section>\n\n<section data-pane=\"lineups\" hidden>\n<div class=\"card\"><h2>Game line-ups<\/h2>\n<div class=\"tools\"><select id=\"lu-match\" aria-label=\"Match\"><\/select><button class=\"pill\" data-b=\"V\" aria-pressed=\"true\">Varsity<\/button><button class=\"pill\" data-b=\"J\" aria-pressed=\"false\">JV<\/button><button class=\"btn btn-line\" id=\"lu-clear\" style=\"margin:0\">Clear this block<\/button><\/div>\n<p class=\"muted\">Ranks 1\u20133 for BS, GS, BD, GD and MXD. Each dropdown lists the matching division and gender first. Players see their spot in the Portal right away.<\/p><div id=\"lu-box\"><\/div><\/div>\n<\/section>\n\n<section data-pane=\"clearance\" hidden>\n<div class=\"tabs subtabs\" data-group=\"clr\"><button class=\"pill\" data-s=\"list\" aria-pressed=\"true\">Checklist<\/button><button class=\"pill\" data-s=\"players\" aria-pressed=\"false\">Players<\/button><\/div>\n<div class=\"card\" data-sg=\"clr\" data-s=\"list\"><h2>Clearance checklist<\/h2><p class=\"muted\">What every player sees in the Portal. Edit the wording, reorder, add or delete.<\/p>\n<form id=\"ck-form\" class=\"tools\" novalidate><input id=\"ck-label\" placeholder=\"New checklist item\" aria-label=\"New checklist item\"><button class=\"btn btn-red\" style=\"margin:0\">Add item<\/button><\/form><ul class=\"clean\" id=\"ck-list\"><\/ul><\/div>\n<div class=\"card\" data-sg=\"clr\" data-s=\"players\"><h2>Player clearance<\/h2>\n<div class=\"tools\
